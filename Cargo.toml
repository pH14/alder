[package]
name = "alder"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A durable work-and-attempt log for autonomous engineering workflows"

[dependencies]
alder-log = { path = "crates/alder-log" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ulid = "1"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[workspace]
members = ["crates/alder-log", "crates/alder-model", "crates/alderd"]
resolver = "3"
