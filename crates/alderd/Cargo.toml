[package]
name = "alderd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A token-free daemon that decides when to wake an Alder leader agent"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
