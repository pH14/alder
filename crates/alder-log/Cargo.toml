[package]
name = "alder-log"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A synchronous Git-backed append-only JSON record log"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
